<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="app">
            <h1 id="converter-title">Metric/Imperial Unit Conversion</h1>
            <input id="number" type="number" value="20">
            <button id="convert-button">Convert</button>
        </div>
        <div class="results">
            <div class="card">
                <h2 class="card-title">Length(Meter/Feet)</h2>
                <h3 class="card-value" id="length-value">
                    20 meters = 65.616 feet | 20 feet = 6.096 meters
                </h3>
            </div>
            <div class="card">
                <h2 class="card-title">Volume(Liters/Gallons)</h2>
                <h3 class="card-value" id="volume-value">
                    20 liters = 5.284 gallons | 20 gallons = 75.708 liters
                </h3>
            </div>
            <div class="card">
                <h2 class="card-title">Mass(Kilograms/Pounds)</h2>
                <h3 class="card-value" id="mass-value">
                    20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos
                </h3>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
